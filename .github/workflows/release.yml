name: release
# Push a tag like v0.20.0: check that the tag matches the version, build single-file binaries with
# `cargo xtask build` (macOS ones on macOS, so they are natively signed; Linux ones with cross, against
# an old glibc and as static musl binaries; Windows ones on Windows, with the C runtime linked in, as
# .zip), start every one of them on a machine that can run it, then attach them to a GitHub release
# with build provenance. Actions are pinned to commits (Dependabot keeps them current); Rust is the
# runner's rustup, updated to stable.
# A pull request that changes this workflow or the build runs everything but the release itself.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, xtask/**, .cargo/**, Cargo.toml, Cargo.lock, scripts/install.ps1, npm/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable
      - name: The tag is the version the binary will report
        id: version
        run: |
          version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sasacode-cli") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm="v$(jq -r .version npm/sasacode/package.json)"
          [ "$npm" = "$version" ] || { echo "npm/sasacode/package.json is $npm, Cargo.toml (sasacode-cli) is $version"; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/*) [ "$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml ($version)"; exit 1; } ;;
          esac
      - run: cargo test --workspace --locked
  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            targets: darwin
            add: aarch64-apple-darwin x86_64-apple-darwin
          # cross (cross-rs) builds in its images: Ubuntu 16.04's glibc 2.23 for the gnu targets, a
          # musl toolchain for the static ones.
          - os: ubuntu-latest
            targets: linux
            cross: --cross
          # aarch64-pc-windows-msvc: MSVC's ARM64 tools and LLVM's clang (for ring) come with the image.
          - os: windows-latest
            targets: windows
            add: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable
      - if: matrix.add
        run: rustup target add ${{ matrix.add }}
      - if: matrix.cross
        run: cargo install cross --locked --version 0.2.5
      - run: cargo xtask build --targets ${{ matrix.targets }} ${{ matrix.cross }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.targets }}
          path: dist/sasacode-*
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Package
        run: |
          cd dist
          for f in sasacode-*; do
            case "$f" in
              *.exe) zip -q -j "${f%.exe}.zip" "$f" ;; # Windows: a .zip, which Explorer and Expand-Archive open
              *) chmod 755 "$f" && tar czf "$f.tar.gz" "$f" ;; # artifacts drop the executable bit
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
  smoke:
    # Every binary is started once: --version must be the tag, --help and a subcommand must run. The
    # musl ones run in a bare Alpine (static: no libraries to add), the gnu ones also on Ubuntu 16.04
    # (the oldest glibc they are built for).
    needs: [check, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest, run: "" }
          - { target: darwin-x64, os: macos-latest, run: "arch -x86_64" } # Rosetta
          - { target: linux-x64, os: ubuntu-latest, run: "docker:ubuntu:16.04" }
          - { target: linux-x64-baseline, os: ubuntu-latest, run: "" }
          - { target: linux-arm64, os: ubuntu-24.04-arm, run: "docker:ubuntu:16.04" }
          - { target: linux-x64-musl, os: ubuntu-latest, run: "docker:alpine:3" }
          - { target: linux-arm64-musl, os: ubuntu-24.04-arm, run: "docker:alpine:3" }
          - { target: windows-x64, os: windows-latest, run: "" }
          - { target: windows-x64-baseline, os: windows-latest, run: "" }
          - { target: windows-arm64, os: windows-11-arm, run: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Start sasacode-${{ matrix.target }}
        shell: bash # Git Bash on Windows
        env:
          BIN: sasacode-${{ matrix.target }}
          RUNNER: ${{ matrix.run }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          if [ -f "$BIN.zip" ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '$BIN.zip' -DestinationPath ."
            BIN="$BIN.exe"
          else
            tar xzf "$BIN.tar.gz"
          fi
          cat > smoke.sh <<'EOF'
          set -eu
          export SASACODE_HOME="$(mktemp -d)"
          got="$("./$1" --version)"
          [ "v$got" = "$2" ] || { echo "--version said $got, expected $2"; exit 1; }
          "./$1" --help > /dev/null
          "./$1" endpoint list > /dev/null
          echo "$1 $got ok"
          EOF
          case "$RUNNER" in
            docker:*) docker run --rm -v "$PWD:/w" -w /w "${RUNNER#docker:}" sh smoke.sh "$BIN" "$VERSION" ;;
            *) $RUNNER sh smoke.sh "$BIN" "$VERSION" ;;
          esac
  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: cp scripts/install.sh scripts/install.ps1 dist/ && cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS
      # Signed provenance: `gh attestation verify <file> --repo sasanokusa/sasacode` proves a file
      # was built by this workflow from this repository, which a matching checksum alone cannot.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/install.ps1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.zip SHA256SUMS install.sh install.ps1
      # Tell the Discord channel (secret DISCORD_WEBHOOK_URL; skipped without it). The summary is the
      # tag's message (`git tag -a vX -m "…"`), else the release commit's subject. A failed post
      # never fails the release.
      - name: Announce on Discord
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "no DISCORD_WEBHOOK_URL"; exit 0; }
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          summary=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d' | grep -v '^Co-Authored-By:')
          [ -n "$summary" ] || summary=$(git log -1 --format=%s "$GITHUB_REF_NAME")
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          text=$(printf '🎋 **sasacode %s** が出ました！\n\n%s\n\n更新: `sasacode update`\n%s' "$GITHUB_REF_NAME" "$summary" "$url")
          jq -n --arg c "${text:0:1990}" '{username: "sasacode", content: $c}' |
            curl -fsS -X POST -H "Content-Type: application/json" --data @- "$WEBHOOK"
