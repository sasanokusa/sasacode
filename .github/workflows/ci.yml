name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (Bun from package.json)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The repository's own checks (core line budget, the dependency record, the READMEs staying in
      # step with the CLI) run inside `bun test` too; this prints them next to the core's headroom.
      - run: bun run improve
