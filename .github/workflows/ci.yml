name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The workspace on the three systems sasacode ships for: format, lints and every crate's tests.
    # xtask's tests include the repository's own checks (core line budget, the dependency record, the
    # READMEs staying in step with the CLI and the bundled plugins, the docs' links), so a change that
    # breaks one fails here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The GUI's tests draw Japanese. With no font that has it, cosmic-text shapes each line again
      # with every font installed before giving up, and the tests took minutes instead of seconds.
      # Noto Sans CJK is the font it asks for by name on Linux; macOS and Windows have their own.
      # Bounded and allowed to fail: apt once hung here for a quarter of an hour, and without the
      # font the tests still pass, only slowly.
      - if: runner.os == 'Linux'
        timeout-minutes: 3
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
      # Every crate runs even after one fails, so one run shows every failure (Windows above all).
      - run: cargo test --workspace --locked --no-fail-fast
      # The CLI end to end: the tests start the binary SASACODE_E2E_BIN names, and skip (passing)
      # without it, so it is set here, to the sasacode just built (with .exe on Windows).
      - name: CLI end to end
        shell: bash
        run: |
          cargo build --locked --package sasacode-cli --bin sasacode
          bin=target/debug/sasacode
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          SASACODE_E2E_BIN="$bin" cargo test --locked --package sasacode-testing --test cli_e2e
      # The checks once more, printed next to the core's headroom (docs/improvement.md).
      - run: cargo xtask improve
  audit:
    # The locked dependencies against the RustSec advisory database. Only an advisory that names a
    # version in Cargo.lock as affected fails the job: a warning (a crate no longer maintained, a
    # yanked version) is printed and left at that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
