[package]
name = "sasacode-gui"
description = "A desktop window for sasacode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sasacode-protocol = { path = "../sasacode-protocol" }
serde_json.workspace = true
iced = { version = "0.14", features = ["markdown", "tokio", "advanced", "svg", "highlighter", "image"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
# Math (KaTeX's layout, with its fonts in the program) and Mermaid diagrams in replies, drawn as SVG.
ratex-parser = { version = "0.1.16", default-features = false }
ratex-layout = { version = "0.1.16", default-features = false }
ratex-svg = { version = "0.1.16", default-features = false, features = ["embed-fonts"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }

[dev-dependencies]
# Draws and drives the window without a display: the tests in `drive.rs`, and the snapshot test
# (`cargo test -p sasacode-gui -- --ignored snapshots`).
iced_test = "0.14"
